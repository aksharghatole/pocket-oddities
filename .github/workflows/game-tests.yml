name: Test every Pocket Oddities game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcade-browser-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-tests:
    name: Arcade on Pixel 5 and compact Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and library structure
        run: |
          npm test
          for file in games.js achievements.js sw.js game-packs/*.js; do node --check "$file"; done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise every game on Android-sized screens
        run: npm run test:games
      - name: Publish mobile test summary
        if: always()
        run: |
          echo "## Pocket Oddities Android mobile-browser tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Every discovered game is exercised at both Pixel 5 and compact Android screen sizes." >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/results.xml ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = ET.parse('test-results/results.xml').getroot()
          fields = {
              'Tests': 'tests',
              'Failures': 'failures',
              'Errors': 'errors',
              'Skipped': 'skipped',
              'Duration (seconds)': 'time',
          }
          print(' · '.join(f'{label}: **{report.get(key, "0")}**' for label, key in fields.items()))
          if Path('playwright-report/index.html').is_file():
              print('\nDownload the `pocket-oddities-game-test-report` artifact and run `npx playwright show-report playwright-report` from its extracted directory.')
          PY
          else
            echo "No browser test results were produced. Check the failed step in the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save screenshots, traces, and HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-oddities-game-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
